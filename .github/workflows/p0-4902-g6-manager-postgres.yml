name: P0 G6 Native Manager PostgreSQL Replay Guard
on:
  push:
    branches: [p0/owner-vy-core-coding-contract-20261016]
    paths:
      - tests/coding-p0-g6-native-manager-postgres.mjs
      - .github/workflows/p0-4902-g6-manager-postgres.yml
      - apps/tigeriq-coding-lane/coding-lane.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-native-owner-hold-sql:
    name: G6 Native Manager PostgreSQL Verify
    if: github.repository == 'newsdayads/tigeriq-ai-lab' && github.event.repository.private == false && github.ref == 'refs/heads/p0/owner-vy-core-coding-contract-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: g6test
          POSTGRES_PASSWORD: sandbox-only
          POSTGRES_DB: g6test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U g6test -d g6test"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://g6test:sandbox-only@127.0.0.1:5432/g6test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source SHA and script syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check tests/coding-p0-g6-native-manager-postgres.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run native manager SQL against real disposable PostgreSQL
        run: node tests/coding-p0-g6-native-manager-postgres.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-g6-native-manager-owner-hold
          path: p0-g6-manager-db-evidence/receipt.json
          if-no-files-found: warn
          retention-days: 7
