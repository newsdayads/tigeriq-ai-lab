name: WO-014 Queue Hygiene

on:
  push:
    branches:
      - wo014/web-control-queue-hygiene
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Queue Hygiene Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tigeriq_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tigeriq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tigeriq_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          printf 'TESTED_SHA=%s\n' "$TESTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Syntax check control API
        run: node --check api/control.mjs
      - name: Verify deterministic queue hygiene
        run: node scripts/verify_queue_hygiene.mjs
      - name: Verify Work Board UI
        run: node scripts/verify_work_board_ui.mjs
      - name: Existing build gate
        run: npm run build
