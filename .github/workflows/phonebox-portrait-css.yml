name: PhoneBox portrait CSS
on:
  pull_request:
    paths:
      - 'apps/phonebox-web/owner-overrides/**'
      - 'apps/phonebox-web/owner-portrait-layout.test.mjs'
      - '.github/workflows/phonebox-portrait-css.yml'
  push:
    branches: [main]
    paths:
      - 'apps/phonebox-web/owner-overrides/**'
      - 'apps/phonebox-web/owner-portrait-layout.test.mjs'
      - '.github/workflows/phonebox-portrait-css.yml'
permissions:
  contents: read
jobs:
  portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test apps/phonebox-web/owner-portrait-layout.test.mjs apps/phonebox-web/owner-quota-rotation.test.mjs
