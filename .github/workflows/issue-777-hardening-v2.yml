name: Issue 777 Hardening V2

on:
  push:
    branches:
      - tigeriq/nv02/issue-777-smart-router-foundation
    paths:
      - .github/workflows/issue-777-hardening-v2.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tigeriq/nv02/issue-777-smart-router-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply bounded hardening
        run: python scripts/issue-777-hardening-v2.py
      - name: Install dependencies
        run: npm ci
      - name: Verify focused source and regression
        run: |
          node --check apps/tigeriq-core/core.mjs
          npx vitest run tests/smart-router.test.ts tests/core-smart-router-integration.test.ts tests/core-ollama-identity.test.ts tests/web-control-routing.test.ts
          npm run typecheck
          npm run build
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/tigeriq-core/core.mjs apps/tigeriq-core/smart-router.mjs tests/smart-router.test.ts tests/core-smart-router-integration.test.ts tests/core-ollama-identity.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(#777): harden resource identity quota and routing"
          git push origin HEAD:tigeriq/nv02/issue-777-smart-router-foundation
