name: M0 Cloud Gate

on:
  push:
    branches:
      - 'reset/m0-canonical-runtime'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tigeriq-m0-cloud-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PowerShell syntax
        shell: pwsh
        run: ./scripts/verify-powershell.ps1
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Playwright smoke
        run: npm run test:e2e
      - name: Build
        run: npm run build
