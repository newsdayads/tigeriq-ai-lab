name: Issue 777 Fix Apply Trigger

on:
  push:
    branches:
      - tigeriq/nv02/issue-777-smart-router-foundation
    paths:
      - .github/workflows/issue-777-fix-trigger.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tigeriq/nv02/issue-777-smart-router-foundation
          fetch-depth: 0
      - name: Fix exact newline anchor and retrigger apply
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/issue-777-apply.yml')
          s=p.read_text(encoding='utf-8')
          old='pattern=r"async function recoverAfterCoreRestart\\(\\) \\{.*?\\n\\}async function claimJob\\(\\) \\{"'
          new='pattern=r"async function recoverAfterCoreRestart\\(\\) \\{.*?\\n\\}\\nasync function claimJob\\(\\) \\{"'
          if s.count(old)!=1:
              raise SystemExit(f'anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "TigerIQ NV02"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/issue-777-apply.yml
          git commit -m "fix(#777): correct bounded migration newline anchor"
          git push origin HEAD:tigeriq/nv02/issue-777-smart-router-foundation
