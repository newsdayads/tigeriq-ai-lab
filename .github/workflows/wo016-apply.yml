name: WO-016 Apply Explicit Dispatch

on:
  push:
    branches:
      - wo016/explicit-dispatch
    paths:
      - scripts/wo016_apply.py
      - .github/workflows/wo016-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wo016/explicit-dispatch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply bounded patch
        run: python scripts/wo016_apply.py
      - name: Verify explicit dispatch invariants
        run: node scripts/verify_explicit_dispatch.mjs
      - name: Verify existing queue invariants
        run: node scripts/verify_queue_hygiene.mjs
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name "tigeriq-ci"
          git config user.email "actions@users.noreply.github.com"
          git add api/control.mjs public/index.html scripts/verify_explicit_dispatch.mjs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "WO-016: apply explicit dispatch fallback"
          git push origin HEAD:wo016/explicit-dispatch
