name: CI

on:
  pull_request:
  push:
    branches: [main, phase-0-foundation, phase1/control-plane, phase2/durable-journal, phase3/http-api, phase4/durable-api, phase5/operational-safety, phase6/runtime-guardrails, phase7/metrics-overload, phase8/actor-rate-limits]

permissions:
  contents: read

jobs:
  verify:
    name: CI Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tigeriq_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tigeriq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tigeriq_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          printf 'TESTED_SHA=%s\n' "$TESTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PowerShell syntax
        shell: pwsh
        run: ./scripts/verify-powershell.ps1
      - name: Install
        run: npm ci
      - name: Runtime and browser syntax
        run: npm run test:syntax
      - name: Vercel deployment policy
        run: npm run test:vercel-policy
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install browser for runtime E2E
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - name: Preserve test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step1-evidence-${{ env.TESTED_SHA }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
