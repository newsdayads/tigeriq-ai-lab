name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-0-foundation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Playwright smoke
        run: npm run test:e2e
      - name: Build
        run: npm run build
