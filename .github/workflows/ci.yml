name: CI

on:
  pull_request:
  push:
    branches: [main, phase-0-foundation, phase1/control-plane, phase2/durable-journal, phase3/http-api, phase4/durable-api, phase5/operational-safety, phase6/runtime-guardrails, phase7/metrics-overload, phase8/actor-rate-limits]

permissions:
  contents: read

jobs:
  verify:
    name: CI Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PowerShell syntax
        shell: pwsh
        run: ./scripts/verify-powershell.ps1
      - name: Install
        run: npm ci
      - name: Web hosting deployment guard
        run: npm run test:vercel-policy
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Playwright smoke
        run: npm run test:e2e
      - name: Build
        run: npm run build

  frontend-functional:
    name: Frontend Functional Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install application and browser test dependencies
        run: npm ci
      - name: Execute real Chromium UI functional flows
        run: npm run test:e2e

  backend-contract:
    name: Backend Contract Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend API test dependencies
        run: npm ci
      - name: Execute real HTTP API and WorkItem contract tests
        run: npx vitest run tests/api.test.ts tests/api-workitems.test.ts

  revenue-actor-entry:
    name: Revenue Actor Entry Contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Required URL and credential-safe Actor log contract
        run: node --test apps/revenue-lab/apify-website-audit/actor-input.test.mjs
      - name: Validate live HTTP evidence shape without external requests
        run: node --test apps/revenue-lab/apify-website-audit/public-live-smoke.test.mjs
      - name: Audit public example.com via real HTTPS (no Apify and no paid API)
        env:
          TIGERIQ_VERIFIED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TIGERIQ_VERIFIED_SOURCE_SHA"
          node apps/revenue-lab/apify-website-audit/public-live-smoke.mjs
