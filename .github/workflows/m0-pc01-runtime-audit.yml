name: M0 PC01 Runtime Audit

on:
  push:
    branches:
      - 'reset/m0-canonical-runtime'
    paths:
      - '.github/workflows/m0-pc01-runtime-audit.yml'
      - 'scripts/pc-worker/audit-m0-runtime.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tigeriq-m0-pc01-runtime-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout reset branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run read-only M0 audit
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & .\scripts\pc-worker\audit-m0-runtime.ps1 | Tee-Object -FilePath artifacts\m0-runtime-audit.json
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-runtime-audit
          path: artifacts/m0-runtime-audit.json
          if-no-files-found: error
          retention-days: 14
