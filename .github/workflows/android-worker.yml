name: Android Worker

on:
  pull_request:
    paths:
      - 'apps/android-worker/**'
      - '.github/workflows/android-worker.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android-worker/**'
      - '.github/workflows/android-worker.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify stable signing is not present in CI by default
        working-directory: apps/android-worker
        run: |
          test -z "${TIGERIQ_ANDROID_KEYSTORE:-}"
          test -z "${TIGERIQ_ANDROID_STORE_PASSWORD_FILE:-}"
          test -z "${TIGERIQ_ANDROID_KEY_PASSWORD_FILE:-}"
          gradle --no-daemon :app:tigerIqStableSigningStatus | grep TIGERIQ_STABLE_SIGNING_NOT_CONFIGURED
      - name: Enforce v0.7 bank-safe Android source surface
        run: |
          set -euo pipefail
          manifest='apps/android-worker/app/src/main/AndroidManifest.xml'
          build='apps/android-worker/app/build.gradle.kts'
          v07='apps/android-worker/app/src/main/java/ai/tigeriq/worker/v07'
          test "$(grep -c '<uses-permission ' "$manifest")" -eq 3
          grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$manifest"
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' "$manifest"
          grep -q 'java.exclude("ai/tigeriq/worker/\*.java")' "$build"
          test ! -e apps/android-worker/app/src/main/res/xml/accessibility_service_config.xml
          test -e "$v07/V07PeriodicWakeWorker.java"
          grep -q 'PeriodicWorkRequest' "$v07/V07WorkScheduler.java"
          grep -q 'ExistingPeriodicWorkPolicy.KEEP' "$v07/V07WorkScheduler.java"
          grep -q 'V07WorkScheduler.enqueueRecovery' "$v07/V07PeriodicWakeWorker.java"
          forbidden='BIND_ACCESSIBILITY_SERVICE|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS|QUERY_ADVANCED_PROTECTION_MODE|SYSTEM_ALERT_WINDOW|QUERY_ALL_PACKAGES|REQUEST_INSTALL_PACKAGES|REQUEST_DELETE_PACKAGES|PACKAGE_USAGE_STATS|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_VPN_SERVICE|BIND_DEVICE_ADMIN|MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_|READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CALL_LOG|WRITE_CALL_LOG|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_BACKGROUND_LOCATION|RECORD_AUDIO|CAMERA|AccessibilityBridgeService|ForegroundWorkerService|com\.google\.android\.apps\.bard|com\.tailscale\.ipn'
          if grep -E "$forbidden" "$manifest"; then
            echo 'BANK_SAFE_MANIFEST_FAIL: forbidden capability in v0.7 source manifest' >&2
            exit 1
          fi
          if grep -R -n -E 'AccessibilityBridgeService|com\.google\.android\.apps\.bard|ProcessBuilder|Runtime\.getRuntime|DexClassLoader|MediaProjection|Settings\.canDrawOverlays' "$v07"; then
            echo 'BANK_SAFE_EXECUTION_FAIL: forbidden execution primitive in v0.7 runtime' >&2
            exit 1
          fi
          if grep -R -n -E 'GEMINI_API_KEY|GROQ_API_KEY|OPENROUTER_API_KEY|AIza[0-9A-Za-z_-]{20,}' apps/android-worker/app/src/main; then
            echo 'BANK_SAFE_SECRET_FAIL: provider credential material found in Android source/resources' >&2
            exit 1
          fi
          echo 'BANK_SAFE_V07_SOURCE_GATE_PASS'
      - name: Run Android v0.7 unit tests
        working-directory: apps/android-worker
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug and unsigned release APKs
        working-directory: apps/android-worker
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Audit merged APK manifest and DEX surface
        run: |
          set -euo pipefail
          apk='apps/android-worker/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$apk"
          analyzer="$(command -v apkanalyzer || true)"
          if [ -z "$analyzer" ]; then analyzer="$(find "$ANDROID_HOME" -type f -name apkanalyzer 2>/dev/null | head -1)"; fi
          test -n "$analyzer"
          "$analyzer" manifest print "$apk" > /tmp/tigeriq-v07-merged-manifest.xml
          forbidden='BIND_ACCESSIBILITY_SERVICE|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS|QUERY_ADVANCED_PROTECTION_MODE|SYSTEM_ALERT_WINDOW|QUERY_ALL_PACKAGES|REQUEST_INSTALL_PACKAGES|REQUEST_DELETE_PACKAGES|PACKAGE_USAGE_STATS|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_VPN_SERVICE|BIND_DEVICE_ADMIN|MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_|READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CALL_LOG|WRITE_CALL_LOG|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_BACKGROUND_LOCATION|RECORD_AUDIO|CAMERA|AccessibilityBridgeService|ForegroundWorkerService|com\.google\.android\.apps\.bard|com\.tailscale\.ipn'
          if grep -E "$forbidden" /tmp/tigeriq-v07-merged-manifest.xml; then
            echo 'BANK_SAFE_MERGED_MANIFEST_FAIL' >&2
            exit 1
          fi
          : > /tmp/tigeriq-v07-dex-strings.txt
          while IFS= read -r dex; do
            unzip -p "$apk" "$dex" | strings >> /tmp/tigeriq-v07-dex-strings.txt
          done < <(unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?\.dex$')
          if grep -E 'ai/tigeriq/worker/AccessibilityBridgeService|ai/tigeriq/worker/ForegroundWorkerService|com/google/android/apps/bard|com\.google\.android\.apps\.bard' /tmp/tigeriq-v07-dex-strings.txt; then
            echo 'BANK_SAFE_DEX_FAIL: legacy automation code packaged in APK' >&2
            exit 1
          fi
          echo 'BANK_SAFE_V07_BUILT_APK_GATE_PASS'
      - name: Preserve unsigned CI artifacts before signing-contract test
        run: |
          set -euo pipefail
          test -f apps/android-worker/app/build/outputs/apk/debug/app-debug.apk
          test -f apps/android-worker/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p .ci-artifacts
          cp apps/android-worker/app/build/outputs/apk/debug/app-debug.apk .ci-artifacts/tigeriq-worker-debug.apk
          cp apps/android-worker/app/build/outputs/apk/release/app-release-unsigned.apk .ci-artifacts/tigeriq-worker-unsigned-release.apk
      - name: Prove stable signing configuration with disposable CI identity
        working-directory: apps/android-worker
        env:
          TIGERIQ_ANDROID_KEYSTORE: ${{ github.workspace }}/.ci-signing/ci-test.jks
          TIGERIQ_ANDROID_KEY_ALIAS: ci-test
          TIGERIQ_ANDROID_STORE_PASSWORD_FILE: ${{ github.workspace }}/.ci-signing/store-password.txt
          TIGERIQ_ANDROID_KEY_PASSWORD_FILE: ${{ github.workspace }}/.ci-signing/key-password.txt
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci-signing"
          printf '%s' 'CI_ONLY_NOT_TIGERIQ_PRIVATE_KEY' > "$TIGERIQ_ANDROID_STORE_PASSWORD_FILE"
          printf '%s' 'CI_ONLY_NOT_TIGERIQ_PRIVATE_KEY' > "$TIGERIQ_ANDROID_KEY_PASSWORD_FILE"
          keytool -genkeypair -keystore "$TIGERIQ_ANDROID_KEYSTORE" -storepass 'CI_ONLY_NOT_TIGERIQ_PRIVATE_KEY' -keypass 'CI_ONLY_NOT_TIGERIQ_PRIVATE_KEY' -alias "$TIGERIQ_ANDROID_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 2 -dname 'CN=TigerIQ CI Disposable' >/dev/null 2>&1
          gradle --no-daemon :app:clean :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk
          first="$(keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')"
          test -n "$first"
          gradle --no-daemon :app:clean :app:assembleRelease
          second="$(keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')"
          test "$first" = "$second"
          echo "STABLE_SIGNING_CERTIFICATE_REUSE_PASS"
          rm -rf "$GITHUB_WORKSPACE/.ci-signing"
      - uses: actions/upload-artifact@v4
        with:
          name: tigeriq-worker-debug-apk
          path: .ci-artifacts/tigeriq-worker-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: tigeriq-worker-unsigned-release-apk
          path: .ci-artifacts/tigeriq-worker-unsigned-release.apk
          if-no-files-found: error
          retention-days: 7
