name: WO-045 PC01 Secure Worker

on:
  pull_request:
    paths:
      - 'scripts/pc-worker/**'
      - 'scripts/install-work-state-postgres.ps1'
      - 'apps/workforce-controller/**'
      - 'packages/work-state/**'
      - 'db/migrations/**'
      - '.github/workflows/wo045-pc01-security.yml'
  push:
    branches:
      - 'wo045/pc01-autonomy-hardening'
    paths:
      - 'scripts/pc-worker/**'
      - 'scripts/install-work-state-postgres.ps1'
      - 'apps/workforce-controller/**'
      - 'packages/work-state/**'
      - 'db/migrations/**'
      - '.github/workflows/wo045-pc01-security.yml'

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Compile PC01 worker runtime
        run: |
          python -m py_compile scripts/pc-worker/control_plane_v2.py scripts/pc-worker/worker_secure_v3.py scripts/pc-worker/live_upgrade_secure_v3.py scripts/pc-worker/runner_prepare_workforce_pc01.py scripts/pc-worker/bootstrap_worker_v2.py scripts/pc-worker/test_control_plane_v2.py scripts/pc-worker/test_worker_secure_v3.py scripts/pc-worker/test_watchdog_v3_contract.py
      - name: Control plane tests
        working-directory: scripts/pc-worker
        run: python test_control_plane_v2.py
      - name: Secure worker scope and typed-tool regression tests
        working-directory: scripts/pc-worker
        run: python test_worker_secure_v3.py
      - name: Watchdog recovery contract tests
        working-directory: scripts/pc-worker
        run: python test_watchdog_v3_contract.py
      - name: Controller transport typecheck single-store and durable-replay guard
        run: |
          npm ci
          npm run typecheck
          test -f db/migrations/001_operational_state_v1.sql
          test -f db/migrations/002_device_proof_replay_v1.sql
          test ! -f scripts/pc-worker/workforce-controller-v1/workforce_controller_v1.sql
          ! grep -R '/v1/android/sessions\|/v1/android/jobs/pull\|/v1/android/jobs/submit' apps/workforce-controller packages/work-state
          grep -q 'device_proof_replay_state' apps/workforce-controller/src/device-auth.ts
          ! grep -q 'seenNonces' apps/workforce-controller/src/device-auth.ts
          echo 'PC01_CONTROLLER_SINGLE_STORE_DURABLE_REPLAY_PASS'

  watchdog-powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse PC01 PowerShell installers and watchdog
        shell: powershell
        run: |
          $paths = @(
            'scripts/pc-worker/worker-watchdog-v3.ps1',
            'scripts/install-work-state-postgres.ps1',
            'scripts/pc-worker/workforce-controller-v1/install-workforce-controller-v1.ps1',
            'scripts/pc-worker/workforce-controller-v1/health-workforce-controller-v1.ps1'
          )
          foreach ($path in $paths) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path :: $($_.Message)" }
              exit 1
            }
          }
          Write-Host 'PC01_POWERSHELL_PARSE_PASS'
