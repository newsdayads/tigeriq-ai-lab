name: WO-045 PC01 Secure Worker

on:
  pull_request:
    paths:
      - 'scripts/pc-worker/**'
      - '.github/workflows/wo045-pc01-security.yml'
  push:
    branches:
      - 'wo045/pc01-autonomy-hardening'
    paths:
      - 'scripts/pc-worker/**'
      - '.github/workflows/wo045-pc01-security.yml'

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PC01 runtime
        run: |
          python -m py_compile scripts/pc-worker/control_plane_v2.py scripts/pc-worker/worker_secure_v3.py scripts/pc-worker/live_upgrade_secure_v3.py scripts/pc-worker/runner_prepare_workforce_pc01.py scripts/pc-worker/bootstrap_worker_v2.py scripts/pc-worker/test_control_plane_v2.py scripts/pc-worker/test_worker_secure_v3.py scripts/pc-worker/test_watchdog_v3_contract.py
          python -m py_compile scripts/pc-worker/workforce-controller-v1/workforce_controller_v1.py scripts/pc-worker/workforce-controller-v1/run_workforce_controller_v1.py scripts/pc-worker/workforce-controller-v1/prepare_workforce_controller_v1.py scripts/pc-worker/workforce-controller-v1/health_workforce_controller_v1.py scripts/pc-worker/workforce-controller-v1/test_workforce_controller_v1.py
      - name: Control plane tests
        working-directory: scripts/pc-worker
        run: python test_control_plane_v2.py
      - name: Secure worker scope and typed-tool regression tests
        working-directory: scripts/pc-worker
        run: python test_worker_secure_v3.py
      - name: Watchdog recovery contract tests
        working-directory: scripts/pc-worker
        run: python test_watchdog_v3_contract.py
      - name: Workforce Controller V1 contract tests
        working-directory: scripts/pc-worker/workforce-controller-v1
        run: python test_workforce_controller_v1.py

  watchdog-powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse PC01 PowerShell installers and watchdog
        shell: powershell
        run: |
          $paths = @(
            'scripts/pc-worker/worker-watchdog-v3.ps1',
            'scripts/pc-worker/workforce-controller-v1/install-workforce-controller-v1.ps1'
          )
          foreach ($path in $paths) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path :: $($_.Message)" }
              exit 1
            }
          }
          Write-Host 'PC01_POWERSHELL_PARSE_PASS'
