name: Issue 508 GitHub-first patch
# retry: 2
on:
  push:
    branches: [chat-b/508-live-data-20260909]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: startsWith(github.event.head_commit.message, 'run issue 508 GitHub patch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-b/508-live-data-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic patch
        run: node scripts/issue508-github-patch.mjs
      - name: Install
        run: npm ci
      - name: Focused live-data tests
        run: npx vitest run tests/runtime-truth-client.test.ts tests/web-v5-live-events.test.ts tests/web-v5-runtime-live.test.ts tests/web-v5-sse.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Full unit regression
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name "TigerIQ GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add apps/dashboard/src/executive-data-v4.ts apps/dashboard/src/command-overview-v5.ts apps/dashboard/src/server-v17.ts
          git diff --cached --check
          git commit -m "feat(web): complete runtime-truth live data foundation"
          git push origin HEAD:chat-b/508-live-data-20260909
