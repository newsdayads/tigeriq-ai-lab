name: TigerIQ Auto Work

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: tigeriq-auto-work
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake bounded Web Control backlog worker
        env:
          TIGERIQ_AUTO_WORK_URL: https://tigeriq-ai-lab.vercel.app/api/auto-work
          GITHUB_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --max-time 90 \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_JOB_TOKEN}" \
            -H 'Content-Type: application/json' \
            "${TIGERIQ_AUTO_WORK_URL}")"
          printf '%s\n' "$response"
          echo "$response" | jq -e '.ok == true and .mode == "autonomous-backlog-worker"' >/dev/null
