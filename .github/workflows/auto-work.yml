name: TigerIQ Auto Work

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tigeriq-auto-work
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake bounded Web Control backlog worker with GitHub OIDC
        env:
          TIGERIQ_AUTO_WORK_URL: https://tigeriq-ai-lab.vercel.app/api/auto-work-wake
          TIGERIQ_OIDC_AUDIENCE: tigeriq-auto-work
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail-with-body --silent --show-error \
            --max-time 30 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${TIGERIQ_OIDC_AUDIENCE}")"
          oidc_token="$(printf '%s' "$oidc_response" | jq -er '.value | select(type == "string" and length > 100)')"
          unset oidc_response
          response="$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --max-time 90 \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H 'Content-Type: application/json' \
            "${TIGERIQ_AUTO_WORK_URL}")"
          unset oidc_token
          printf '%s\n' "$response"
          echo "$response" | jq -e '.ok == true and .mode == "autonomous-backlog-worker"' >/dev/null
