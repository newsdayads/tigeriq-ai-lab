name: WO-013 Lockfile Sync

on:
  push:
    branches:
      - wo013/chief-of-staff-chat
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wo013/chief-of-staff-chat
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile only when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "LOCKFILE_ALREADY_SYNCED"
            exit 0
          fi
          git config user.name "tigeriq-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "WO-013: sync OIDC dependency lockfile"
          git push origin HEAD:wo013/chief-of-staff-chat
