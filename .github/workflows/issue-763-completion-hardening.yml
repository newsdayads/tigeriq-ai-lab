name: Issue 763 Completion Hardening

on:
  push:
    branches:
      - tigeriq/nv05/issue-763-autopilot-recovery-layout
    paths:
      - .github/workflows/issue-763-completion-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tigeriq/nv05/issue-763-autopilot-recovery-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair transform anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/issue-763-hardening.py')
          s=p.read_text(encoding='utf-8')
          old="""    state.lastWindowId=hb.windowId;\n    state.lastError=undefined;\n    recoveryAttempts.set(workerId,0);"""
          new="""    state.lastWindowId=hb.windowId;\n    state.lastError=undefined;\n    state.manualCloseSuppressed=false;\n    recoveryAttempts.set(workerId,0);"""
          if s.count(old)!=1:
              raise SystemExit(f'anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply hardening
        run: python scripts/issue-763-hardening.py
      - name: Verify
        run: |
          npm ci
          npx vitest run tests/chrome-controller.test.ts
          npm run typecheck
          npm run build
      - name: Commit verified source
        run: |
          git config user.name "TigerIQ NV02"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/issue-763-completion-hardening.yml
          git rm -f scripts/issue-763-hardening.py
          git add apps/chrome-controller/extension/content.js apps/chrome-controller/extension/background.js apps/chrome-controller/src/server.ts apps/chrome-controller/src/runtime-evidence.ts tests/chrome-controller.test.ts
          git commit -m "feat(#763): completion-aware UTF-8 supervisor and Owner-safe layout"
          git push origin HEAD:tigeriq/nv05/issue-763-autopilot-recovery-layout
      - name: Assemble artifact
        run: |
          ROOT="artifact/TigerIQ-Chrome-Controller-763"
          mkdir -p "$ROOT/dist/apps/chrome-controller/src" "$ROOT/apps/chrome-controller"
          cp -R dist/apps/chrome-controller/src/* "$ROOT/dist/apps/chrome-controller/src/"
          cp -R apps/chrome-controller/extension "$ROOT/apps/chrome-controller/"
          cp -R apps/chrome-controller/public "$ROOT/apps/chrome-controller/"
          cp apps/chrome-controller/chrome-controller.config.example.json "$ROOT/apps/chrome-controller/"
          cp apps/chrome-controller/Start-ChromeController.ps1 "$ROOT/apps/chrome-controller/"
          git rev-parse HEAD > "$ROOT/VERSION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: TigerIQ-Chrome-Controller-763-completion-aware
          path: artifact/TigerIQ-Chrome-Controller-763
          retention-days: 7
