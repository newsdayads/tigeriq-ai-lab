name: One-shot worker card v1.1.5
on:
  push:
    branches: [tigeriq/nv05/issue-763-autopilot-recovery-layout]
permissions:
  contents: write
jobs:
  build-card:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tigeriq/nv05/issue-763-autopilot-recovery-layout
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply compact employee card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('apps/chrome-controller/extension/content.js')
          s=p.read_text()
          s=s.replace("top: '56px',", "top: '10px',")
          s=s.replace("padding: '9px 14px',", "padding: '6px 10px',")
          s=s.replace("borderRadius: '10px',", "borderRadius: '8px',")
          s=s.replace("font: '800 14px/1.2 system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif',", "font: '800 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif',")
          s=s.replace("border: '2px solid rgba(255,255,255,0.92)',", "border: '1px solid rgba(255,255,255,0.85)',")
          s=s.replace("boxShadow: '0 4px 14px rgba(0,0,0,0.38)',", "boxShadow: '0 2px 8px rgba(0,0,0,0.28)',")
          s=s.replace("opacity: '0.97',", "opacity: '0.94',")
          s=s.replace("display: 'none',", "display: 'block',")
          p.write_text(s)
          m=Path('apps/chrome-controller/extension/manifest.json')
          data=json.loads(m.read_text())
          data['version']='1.1.5'
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-v115-worker-card.yml
          git config user.name "TigerIQ Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/chrome-controller/extension/content.js apps/chrome-controller/extension/manifest.json .github/workflows/one-shot-v115-worker-card.yml
          git commit -m "fix: restore compact worker cards v1.1.5"
          git push origin HEAD:tigeriq/nv05/issue-763-autopilot-recovery-layout
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npx vitest run tests/chrome-controller.test.ts
      - name: Build
        run: npm run build
      - name: Assemble
        shell: bash
        run: |
          ROOT="artifact/TigerIQ-Chrome-Controller-V1.1.5"
          mkdir -p "$ROOT/dist/apps/chrome-controller/src" "$ROOT/apps/chrome-controller"
          cp -R dist/apps/chrome-controller/src/* "$ROOT/dist/apps/chrome-controller/src/"
          cp -R apps/chrome-controller/extension "$ROOT/apps/chrome-controller/"
          cp -R apps/chrome-controller/public "$ROOT/apps/chrome-controller/"
          cp apps/chrome-controller/chrome-controller.config.example.json "$ROOT/apps/chrome-controller/"
          cp apps/chrome-controller/runtime-evidence.schema.json "$ROOT/apps/chrome-controller/"
          cp apps/chrome-controller/INSTALL_WINDOWS.md "$ROOT/apps/chrome-controller/"
          cp apps/chrome-controller/Start-ChromeController.ps1 "$ROOT/apps/chrome-controller/"
          git rev-parse HEAD > "$ROOT/VERSION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: TigerIQ-Chrome-Controller-V1.1.5
          path: artifact/TigerIQ-Chrome-Controller-V1.1.5
          retention-days: 7
