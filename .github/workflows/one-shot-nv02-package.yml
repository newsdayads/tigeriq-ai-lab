name: One-shot NV02 Chrome package

on:
  push:
    branches:
      - tigeriq/nv05/issue-763-autopilot-recovery-layout

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tigeriq/nv05/issue-763-autopilot-recovery-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/chrome-controller.test.ts
      - run: npm run build
      - name: Assemble
        shell: bash
        run: |
          set -euo pipefail
          ROOT="artifact/TigerIQ-Chrome-Controller-NV02"
          mkdir -p "$ROOT/dist/apps/chrome-controller/src" "$ROOT/apps/chrome-controller"
          cp -R dist/apps/chrome-controller/src/* "$ROOT/dist/apps/chrome-controller/src/"
          cp -R apps/chrome-controller/extension "$ROOT/apps/chrome-controller/"
          cp -R apps/chrome-controller/public "$ROOT/apps/chrome-controller/"
          cp apps/chrome-controller/chrome-controller.config.example.json "$ROOT/apps/chrome-controller/"
          cp apps/chrome-controller/runtime-evidence.schema.json "$ROOT/apps/chrome-controller/"
          cp apps/chrome-controller/INSTALL_WINDOWS.md "$ROOT/apps/chrome-controller/"
          cp apps/chrome-controller/Start-ChromeController.ps1 "$ROOT/apps/chrome-controller/"
          printf '%s\n' "$GITHUB_SHA" > "$ROOT/VERSION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: TigerIQ-Chrome-Controller-NV02-v113
          path: artifact/TigerIQ-Chrome-Controller-NV02
          retention-days: 7
      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-nv02-package.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-shot-nv02-package.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove one-shot NV02 v1.1.3 workflow'
          git push origin HEAD:tigeriq/nv05/issue-763-autopilot-recovery-layout
