name: Vercel Web Boundary Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify Owner auth serverless syntax
        run: node --check api/owner-auth.mjs
      - name: Verify Vercel Web-only boundary and release trigger policy
        run: node scripts/verify_vercel_web_only_boundary.mjs
      - name: Verify Vercel config
        run: node -e "const c=JSON.parse(require('fs').readFileSync('vercel.json','utf8')); if(c.git?.deploymentEnabled!==false) process.exit(1); console.log('vercel.json WEB_ONLY PASS')"
      - name: Existing TigerIQ gates
        run: npm run typecheck && npm run test && npm run build
