name: WO-012/013 Vercel Online Verify

on:
  push:
    branches:
      - main
      - wo012/command-center-vercel-online
      - wo013/chief-of-staff-chat
  pull_request:
    branches:
      - main
      - wo010/command-center-web-control
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Vercel Online Verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tigeriq_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tigeriq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tigeriq_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          printf 'TESTED_SHA=%s\n' "$TESTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Vercel API syntax
        run: node --check api/control.mjs && node --check api/chief.mjs && node --check api/chief-smoke.mjs
      - name: Verify Chief router invariants
        run: node scripts/test-chief-router.mjs
      - name: Verify Vercel config
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json PASS')"
      - name: Existing TigerIQ gates
        run: npm run typecheck && npm run test && npm run build
