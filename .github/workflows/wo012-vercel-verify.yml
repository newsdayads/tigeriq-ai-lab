name: WO-012/013 Vercel Online Verify

on:
  push:
    branches:
      - main
      - wo012/command-center-vercel-online
      - wo013/chief-of-staff-chat
  pull_request:
    branches:
      - main
      - wo010/command-center-web-control
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Vercel Online Verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify hosted web API syntax
        run: node --check api/control.mjs && node --check api/chief.mjs && node --check api/chief-smoke.mjs
      - name: Verify Chief router invariants
        run: node scripts/test-chief-router.mjs
      - name: Verify web-hosting boundary
        run: node scripts/verify-vercel-deployment-policy.mjs
      - name: Ensure PowerShell for mandatory native R07 regression tests
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            . /etc/os-release
            case "${ID}:${VERSION_ID}" in
              ubuntu:22.04|ubuntu:24.04|ubuntu:26.04) ;;
              *) echo "Unsupported runner for PowerShell native tests" >&2; exit 1 ;;
            esac
            curl --fail --silent --show-error --retry 2 --max-time 60 \
              "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" \
              -o "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends powershell
          fi
          pwsh -NoProfile -NonInteractive -Command 'if ($PSVersionTable.PSVersion.Major -lt 7) { exit 1 }'
      - name: Existing TigerIQ gates
        run: npm run typecheck && npm run test && npm run build
