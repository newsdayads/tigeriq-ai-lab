name: PhoneBox Web Gateway CI
on:
  pull_request:
    paths:
      - 'apps/phonebox-web/**'
      - '.github/workflows/phonebox-web-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'apps/phonebox-web/**'
      - '.github/workflows/phonebox-web-gateway.yml'
permissions:
  contents: read
jobs:
  phonebox-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check apps/phonebox-web/server.mjs
      - name: Gateway security tests
        run: node --test apps/phonebox-web/server.test.mjs apps/phonebox-web/server.integration.test.mjs apps/phonebox-web/server.public.test.mjs apps/phonebox-web/server.widget-edit.test.mjs apps/phonebox-web/server.private-tailnet.test.mjs apps/phonebox-web/server.google-owner.test.mjs
