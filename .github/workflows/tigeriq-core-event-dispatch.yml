name: TigerIQ Core Event Dispatch

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, assigned, unassigned]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  id-token: write

jobs:
  dispatch:
    if: github.repository == 'newsdayads/tigeriq-ai-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resolve TigerIQ bridge and dispatch signed event
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DELIVERY_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          pointer="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "$API_URL/repos/$REPOSITORY/issues/1402")"
          bridge="$(POINTER="$pointer" python3 - <<'PY'
          import json, os, re
          body=json.loads(os.environ["POINTER"]).get("body") or ""
          m=re.search(r"(?mi)^LIVE_STATUS_BRIDGE_URL=(https://[^\s]+)$",body)
          if not m: raise SystemExit("bridge pointer missing")
          url=m.group(1).rstrip("/")
          if not (url.endswith(".trycloudflare.com") or url.endswith(".ts.net")):
              raise SystemExit("bridge host invalid")
          print(url)
          PY
          )"
          oidc="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=tigeriq-core"             | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors             -X POST "$bridge/github-event"             -H "Authorization: Bearer $oidc"             -H "Content-Type: application/json"             -H "X-GitHub-Event: $EVENT_NAME"             -H "X-TigerIQ-Delivery: $DELIVERY_ID"             --data-binary "@$GITHUB_EVENT_PATH"
