name: WO-045 PC01 Repository-only Guard

on:
  push:
    branches:
      - 'wo045/pc01-autonomy-hardening'
    paths:
      - '.github/workflows/wo045-pc01-selfhosted-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc01-workforce-runtime-repair
  cancel-in-progress: true

jobs:
  repository-only-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Controller V1 package without touching PC01
        run: |
          python -m py_compile scripts/pc-worker/workforce-controller-v1/workforce_controller_v1.py scripts/pc-worker/workforce-controller-v1/workforce_controller_recovery_v1.py scripts/pc-worker/workforce-controller-v1/run_workforce_controller_v1.py scripts/pc-worker/workforce-controller-v1/prepare_workforce_controller_v1.py scripts/pc-worker/workforce-controller-v1/health_workforce_controller_v1.py
          cd scripts/pc-worker/workforce-controller-v1
          python test_workforce_controller_v1.py
          python test_workforce_recovery_v1.py
      - name: Confirm no self-hosted deployment in this workflow
        run: echo 'PC01_REPOSITORY_ONLY_GUARD_PASS'
