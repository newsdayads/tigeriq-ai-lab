name: TigerIQ public showcase checks
on:
  pull_request:
    paths:
      - 'apps/tigeriq-showcase/**'
      - '.github/workflows/tigeriq-showcase.yml'
  push:
    branches:
      - 'feature/tigeriq-public-showcase-20261105'
      - main
    paths:
      - 'apps/tigeriq-showcase/**'
      - '.github/workflows/tigeriq-showcase.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: JavaScript syntax
        run: |
          node --check apps/tigeriq-showcase/main.js
          node --check apps/tigeriq-showcase/server.mjs
      - name: Public site acceptance
        run: node --test apps/tigeriq-showcase/test/site.test.mjs apps/tigeriq-showcase/test/server.test.mjs
