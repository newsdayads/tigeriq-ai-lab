name: Phone Farm Local CI
on:
  pull_request:
    paths:
      - 'apps/phone-farm-local/**'
      - '.github/workflows/phone-farm-local-ci.yml'
  push:
    branches:
      - 'feat/tigeriq-phone-farm-local-v1'
    paths:
      - 'apps/phone-farm-local/**'
      - '.github/workflows/phone-farm-local-ci.yml'
permissions:
  contents: read
jobs:
  validate-phone-farm:
    name: Local Controller Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check apps/phone-farm-local/app.mjs
          node --check apps/phone-farm-local/recording.mjs
          node --check apps/phone-farm-local/ui.js
      - name: Run isolated unit tests
        run: node --test apps/phone-farm-local/test.mjs apps/phone-farm-local/recording.test.mjs

  build-windows:
    name: Windows native EXE build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained Windows x64 host
        shell: pwsh
        run: |
          dotnet publish apps/phone-farm-local/windows/TigerIQPhoneFarm.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$env:RUNNER_TEMP/phonefarm"
          if (!(Test-Path "$env:RUNNER_TEMP/phonefarm/TigerIQPhoneFarm.exe")) { throw "Native Windows EXE missing" }
          Get-Item "$env:RUNNER_TEMP/phonefarm/TigerIQPhoneFarm.exe" | Select-Object Name,Length
