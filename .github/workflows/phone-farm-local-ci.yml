name: Phone Farm Local CI
on:
  pull_request:
    paths:
      - 'apps/phone-farm-local/**'
      - '.github/workflows/phone-farm-local-ci.yml'
  push:
    branches:
      - 'feat/tigeriq-phone-farm-local-v1'
      - 'main'
    paths:
      - 'apps/phone-farm-local/**'
      - '.github/workflows/phone-farm-local-ci.yml'
permissions:
  contents: read
jobs:
  validate-phone-farm:
    name: Local Controller Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check apps/phone-farm-local/app.mjs
          node --check apps/phone-farm-local/recording.mjs
          node --check apps/phone-farm-local/ui.js
      - name: Run isolated unit tests
        run: node --test apps/phone-farm-local/test.mjs apps/phone-farm-local/recording.test.mjs

  build-windows:
    name: Windows native EXE build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Build audited Windows package
        shell: pwsh
        run: |
          & apps/phone-farm-local/windows/package-windows.ps1 -OutputPath "$env:RUNNER_TEMP/phonefarm"
          node --test "$env:RUNNER_TEMP/phonefarm/test.mjs" "$env:RUNNER_TEMP/phonefarm/recording.test.mjs"
          if ($LASTEXITCODE -ne 0) { throw "Bundled self-tests failed: $LASTEXITCODE" }
          Compress-Archive -Path "$env:RUNNER_TEMP/phonefarm/*" -DestinationPath "$env:RUNNER_TEMP/TigerIQ-PhoneFarm-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TigerIQ-PhoneFarm-Windows
          path: ${{ runner.temp }}/TigerIQ-PhoneFarm-Windows.zip
          retention-days: 14
          if-no-files-found: error

  release-windows-rc5:
    name: Publish Windows RC5 pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[P1][GH-5291]')
    needs:
      - validate-phone-farm
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TigerIQ-PhoneFarm-Windows
          path: ${{ runner.temp }}/release
      - name: Publish idempotent RC5 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: tigeriq-phone-farm-windows-v0.5.0-rc5
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::8}"
          SRC="${RUNNER_TEMP}/release/TigerIQ-PhoneFarm-Windows.zip"
          ASSET="${RUNNER_TEMP}/release/TigerIQ-PhoneFarm-Windows-v0.5.0-RC5-${SHORT_SHA}.zip"
          mv "$SRC" "$ASSET"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTING_TARGET="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            test "$EXISTING_TARGET" = "$GITHUB_SHA"
            exit 0
          fi
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "TigerIQ Phone Farm Windows v0.5.0 RC5 - ${SHORT_SHA}" \
            --notes "GH-5291 pre-release from merged main. Source/build CI passed. Runtime acceptance F04/F09/F10 remains tracked separately; this release does not claim FULL acceptance."
