<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081322"><title>TigerIQ · Web Control</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#eef5ff;background:#07111f}body{margin:0;background:linear-gradient(180deg,#081322,#060d17);min-height:100vh}.wrap{width:min(900px,100%);margin:auto;padding:24px 14px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:14px}.muted{color:#93a6bd;font-size:12px}.panel{border:1px solid #1f3858;background:#0d1a2b;border-radius:16px;padding:16px;margin:12px 0}.state{font-size:24px;font-weight:800;margin:8px 0 14px}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#17304d;color:#a8d5ff;font-size:11px}.good{background:#123629;color:#8ee6b3}.warn{background:#4b3a20;color:#ffd78d}.bad{background:#55262c;color:#ffb8bd}button{border:1px solid #31557d;background:#10243b;color:#eef5ff;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.err{display:none;padding:10px;border-radius:10px;background:#30181e;color:#ffb2ba;font-size:12px}.evidence{font:11px ui-monospace,monospace;color:#93a6bd;white-space:pre-wrap}</style></head><body><main class="wrap"><header class="top"><div><h1>TigerIQ · Web Control</h1><div class="muted">One-command self-healing lane · OFF-MAIN · fail-closed</div></div><span id="auth" class="status">Đang kiểm tra Owner</span></header><section class="panel"><div class="muted">TRẠNG THÁI RUNNER</div><div id="state" class="state">IDLE</div><div id="detail" class="muted">Chưa chạy lệnh.</div></section><section class="panel"><div class="row"><div><b>Lệnh Web Control</b><div class="muted">Lệnh duy nhất: <b>1</b></div></div><button id="run">CHẠY 1</button></div></section><div id="err" class="err"></div><section class="panel"><div class="muted">EVIDENCE</div><div id="evidence" class="evidence">Chưa có evidence.</div></section></main><script>const $=id=>document.getElementById(id);function cls(state){return ['done','verified'].includes(String(state).toLowerCase())?'status good':['authorization-required','blocked'].includes(String(state).toLowerCase())?'status bad':'status warn'}function show(data){const state=String(data?.state||'idle').toUpperCase();$('state').textContent=state;$('state').className='state';$('detail').textContent=data?.plan?.cycle?.action||data?.error||'—';$('evidence').textContent=JSON.stringify(data?.evidence||data?.plan||{},null,2);$('err').style.display='none'}async function auth(){try{const r=await fetch('/api/web-control',{cache:'no-store'}),d=await r.json();$('auth').textContent=d.authenticated?'OWNER AUTHORIZED':'OWNER AUTH REQUIRED';$('auth').className=d.authenticated?'status good':'status bad';$('run').disabled=!d.authenticated}catch(e){$('auth').textContent='AUTH CHECK FAILED';$('auth').className='status bad';$('run').disabled=true}}async function run(){let b=$('run');b.disabled=true;$('state').textContent='RUNNING';try{const r=await fetch('/api/web-control',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({command:'1'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'web_control_failed');show(d)}catch(e){$('state').textContent='BLOCKED';$('err').textContent=String(e?.message||e);$('err').style.display='block'}finally{await auth()}}$('run').onclick=run;auth();</script></body></html>
