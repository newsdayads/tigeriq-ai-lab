<!DOCTYPE html>
<html lang='vi'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>TigerIQ Core</title>
  <style>
    body{font-family:system-ui,sans-serif;padding:20px;background:#f4f6f8;}
    h1{color:#1c3b54;}
    table{width:100%;border-collapse:collapse;background:white;margin:20px0;}td,th{border:1px solid #ddd;padding:8px;text-align:left;}
    th{background:#e9f1f7;}
    .badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:12px;} .badge.queued{background:#eee;}
    .badge.claimed{background:#fff4d5;}
    .badge.working{background:#d1e7dd;}
    .badge.evidence{background:#f5f5f5;}
    .badge.verify{background:#cff4fc;}
    .badge.done{background:#d1e7dd;}
    .badge.blocked{background:#f8d7da;}
    #codingLane{border:1px solid #cbd5e1;}
  </style>
</head>
<body>
  <h1>TigerIQ Core</h1>
  <div id='laneInfo'>
    <h2>Coding Lane</h2>
    <table id='codingLane'>
      <thead><tr><th>Work Item</th><th>Lane</th><th>Status</th><th>Owner</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
  (function(){
    const laneTable=document.getElementById('codingLane');
    const laneBody=laneTable?.querySelector('tbody');
    const fetchLane=async()=>{
      try{
        const r=await fetch('/api/workitems');
        const j=await r.json();
        if(laneBody){
          laneBody.innerHTML=(j.items||[]).map(i=>
            `<tr><td>${i.id}</td><td>${i.lane||'default'}</td><td><span class='badge ${i.status}'>${i.status}</span></td><td>${i.owner||'-'}</td></tr>`
          ).join('');
        }
      }catch(e){console.warn(e);}
    };
    fetchLane();
    setInterval(fetchLane,10000);
  })();
  </script>
</body>
</html>
