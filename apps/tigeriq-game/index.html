<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#091328" />
  <meta name="description" content="TigerIQ Game — bản thử nghiệm kỹ thuật Canvas 2D, chưa có câu đố chính thức" />
  <title>TigerIQ Game · Robot Oops! (Technical Preview)</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main class="shell">
    <header><p class="eyebrow">TIGERIQ GAME · G04 TECHNICAL PREVIEW</p><h1>Robot Oops!</h1><p>Thử điều khiển robot trên lưới Canvas 2D. <strong>Chưa phải game 5 màn</strong>.</p></header>
    <section class="playground" aria-label="Bản thử nghiệm điều khiển robot">
      <canvas id="board" width="480" height="480" role="img" aria-label="Lưới 6 x 6 có robot màu xanh và đích màu vàng"></canvas>
      <div class="control-panel"><p id="status" role="status" aria-live="polite">Sẵn sàng.</p>
        <div class="controls"><button id="left" type="button">↶ Quay trái</button><button id="forward" type="button" class="primary">↑ Tiến</button><button id="right" type="button">↷ Quay phải</button></div>
        <button id="reset" type="button" class="reset">Đặt lại</button>
      </div>
    </section>
    <footer>Điều khiển minh họa, không ghi dữ liệu cá nhân · G02/G05 sẽ định nghĩa luật và solver.</footer>
  </main>
</body>
</html>
