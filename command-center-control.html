<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081322"><title>TigerIQ · Command Center</title><style>body{font-family:system-ui,sans-serif;background:#07111f;color:#eef5ff;margin:0}main{max-width:900px;margin:auto;padding:24px}.panel{border:1px solid #1f3858;background:#0d1a2b;border-radius:16px;padding:18px;margin-bottom:14px}button{border:1px solid #2b5682;background:#10243a;color:#eef5ff;border-radius:10px;padding:12px 16px;font-weight:700}button:disabled{opacity:.5}.muted{color:#93a6bd;font-size:13px}.state{font-size:18px;font-weight:800;margin:8px 0}.ok{color:#8de9b5}.warn{color:#ffd38b}.err{color:#ffb2ba}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#b9cbe0}</style></head><body><main><section class="panel"><div class="muted">TIGERIQ · OWNER COMMAND CENTER · OFF-MAIN</div><h1>Web Self-Healing</h1><p class="muted">Một lệnh duy nhất: <b>1</b>. Không Main/Production, reboot, paid action hoặc mở rộng credential/security.</p><button id="run">CHẠY 1</button><div id="state" class="state">IDLE</div><div id="detail" class="muted">Chưa chạy.</div></section><section class="panel"><div class="muted">EVIDENCE</div><pre id="evidence">Chưa có evidence.</pre></section></main><script>const $=id=>document.getElementById(id);function show(state,detail,evidence){$('state').textContent=String(state||'UNKNOWN').toUpperCase();$('state').className='state '+(['verified','done'].includes(String(state).toLowerCase())?'ok':['blocked','authorization-required','external-wait'].includes(String(state).toLowerCase())?'warn':'');$('detail').textContent=detail||'—';$('evidence').textContent=JSON.stringify(evidence||{},null,2)}async function run(){let b=$('run');b.disabled=true;show('RUNNING','Đã gửi lệnh 1; đang chờ evidence từ Web Control.',{});try{let r=await fetch('/api/web-control',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({command:'1'})}),d=await r.json();show(d.state||'blocked',d.error||d.plan?.cycle?.reason||'Web Control response received.',d.evidence||d)}catch(e){show('EXTERNAL_WAIT',String(e?.message||e),{})}finally{b.disabled=false}}$('run').onclick=run;</script></body></html>
