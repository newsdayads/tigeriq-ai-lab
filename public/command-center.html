<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="color-scheme" content="dark">
<title>TigerIQ Live · Công việc</title>
<style>
:root{font-family:"Google Sans Flex","Google Sans","Helvetica Neue",sans-serif;--bg:#07111f;--panel:#0b1829;--line:#203953;--text:#f2f7fd;--muted:#91a4ba;--green:#46d48f;--amber:#efb85c;--red:#ff747e;--blue:#58a6ff;--violet:#c5a6ff;--cyan:#65d7e8;--teal:#58d8c6;--slate:#8fa3b8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:inherit;background:radial-gradient(circle at 90% -12%,#173b6e 0,transparent 36%),linear-gradient(180deg,#081322,#060d17);overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{width:min(760px,100%);margin:auto;padding:max(14px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:4px 2px 14px}
.brand h1{font-size:22px;line-height:1.1;margin:0}
.brand p{font-size:12px;color:var(--muted);margin:5px 0 0}
.live{display:flex;align-items:center;gap:7px;border:1px solid #23513e;background:#0b241b;border-radius:999px;padding:7px 10px;font-size:11px;color:#9aebbd;white-space:nowrap}
.live.warn{border-color:#705322;background:#332714;color:#ffd187}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.live:not(.warn) .live-dot{animation:live-pulse 2.4s ease-out infinite}
.live.warn .live-dot{background:var(--amber)}
.err{display:none;border:1px solid #6d3038;background:#31191e;color:#ffb7bd;border-radius:14px;padding:11px 12px;margin-bottom:10px;font-size:12px;line-height:1.4}
.err.stale{border-color:#705322;background:#332714;color:#ffd187}
.list-head{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:1px 2px 8px}
.list-head h2{font-size:13px;line-height:1.2;margin:0;color:var(--violet);font-weight:850;letter-spacing:.02em;text-transform:uppercase}
.list-head span{font-size:10px;color:var(--muted);text-align:right}
.filters{display:flex;gap:6px;overflow-x:auto;padding:0 0 9px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{border:1px solid #294661;background:#0b1829;color:#91a4ba;border-radius:999px;padding:6px 9px;font:800 9px/1 inherit;white-space:nowrap;transition:.18s ease}
.filter.active{box-shadow:0 0 0 1px rgba(255,255,255,.03) inset}
.filter[data-filter="open"].active{border-color:#6676a8;background:#20294b;color:#ddd7ff}
.filter[data-filter="running"].active{border-color:#2f7757;background:#113928;color:#9ef0bd}
.filter[data-filter="waiting"].active{border-color:#7a5a28;background:#3a2b17;color:#ffd38d}
.filter[data-filter="done"].active{border-color:#246c64;background:#0e3733;color:#91eee0}
.filter b{font-weight:900;color:inherit;margin-left:3px}
.work-list{display:grid;gap:7px}
.work-row{display:block;border:1px solid var(--line);background:linear-gradient(180deg,#102139,#0b1829);border-radius:13px;padding:9px 10px;min-width:0;box-shadow:0 8px 24px rgba(0,0,0,.12);position:relative;overflow:hidden}
.work-row::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:#314b67;opacity:.9}
.work-row.status-working::before{background:var(--green)}
.work-row.status-review::before,.work-row.status-waiting::before{background:var(--amber)}
.work-row.status-queued::before{background:var(--blue)}
.work-row.status-blocked::before{background:var(--red)}
.work-row.status-done::before{background:var(--teal)}
.work-row.status-open::before{background:#71849a}
.work-main{min-width:0}
.work-top{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.rank{width:19px;height:19px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:#17375a;color:#cfe7ff;font-size:10px;font-weight:900;flex:none}
.work-id{font-size:12px;font-weight:900;color:#dbeaff}
.priority{font-size:9px;font-weight:850;border:1px solid #3a506b;background:#142337;color:#aebed0;border-radius:999px;padding:2px 6px}
.priority.p0{border-color:#8a3e78;background:#35182f;color:#ffb7df}
.priority.p1{border-color:#6b50a4;background:#251b43;color:#d3bdff}
.priority.p2{border-color:#315f92;background:#102b4a;color:#a9d6ff}
.priority.p3{border-color:#2e7181;background:#0f3038;color:#93e7f4}
.priority.p4{border-color:#7c6330;background:#392f18;color:#f4d491}
.priority.p5{border-color:#4a5969;background:#1a2430;color:#b5c1cd}
.priority.meta{border-color:#3d4b59;background:#18212b;color:#9aa8b6}
.work-nv{font-size:10px;color:#a7b8cb;font-weight:780}
.work-title{font-size:13.5px;font-weight:780;line-height:1.38;margin-top:7px;overflow-wrap:anywhere;color:#f3f7fc;letter-spacing:.002em}
.work-summary{font-size:11.75px;line-height:1.42;color:#a9bbce;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.state{display:inline-flex;align-items:center;border:1px solid #3a4d63;border-radius:999px;padding:4px 7px;font-weight:850;font-size:9px;white-space:nowrap;margin-left:auto}
.state.working{border-color:#2b7655;background:#113b2a;color:#9af0bc}
.state.review,.state.waiting{border-color:#7a5b2a;background:#3b2d18;color:#ffd58f}
.state.queued{border-color:#37699f;background:#112f50;color:#b5dcff}
.state.blocked{border-color:#81404a;background:#401f26;color:#ffb8bf}
.state.done{border-color:#27736a;background:#0f3a35;color:#94ecdf}
.state.open{border-color:#455d76;background:#132234;color:#b0c1d3}
.progress{display:flex;align-items:center;gap:8px;margin-top:9px;color:#7f95ac}
.progress-track{height:8px;flex:1;min-width:60px;background:#16283b;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.progress-fill{height:100%;background:currentColor;border-radius:999px;position:relative;overflow:hidden;transition:width .45s ease}
.progress-text{font-size:10px;font-weight:900;color:currentColor;white-space:nowrap;min-width:31px;text-align:right}
.work-row.status-working .progress{color:var(--green)}
.work-row.status-review .progress,.work-row.status-waiting .progress{color:var(--amber)}
.work-row.status-queued .progress{color:var(--blue)}
.work-row.status-blocked .progress{color:var(--red)}
.work-row.status-done .progress{color:var(--teal)}
.work-row.status-open .progress{color:#7e93a9}
.work-row.status-working .progress-fill{box-shadow:0 0 10px color-mix(in srgb,currentColor 38%,transparent)}
.work-row.status-working .progress-fill::after{content:"";position:absolute;inset:0;width:38%;transform:translateX(-140%) skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);animation:progress-shimmer 2.3s ease-in-out infinite}
.state.review,.state.waiting{animation:review-breathe 3.4s ease-in-out infinite}
.work-row.recently-updated{animation:card-flash .8s ease-out}
@keyframes live-pulse{0%{box-shadow:0 0 0 0 rgba(70,212,143,.44)}70%{box-shadow:0 0 0 7px rgba(70,212,143,0)}100%{box-shadow:0 0 0 0 rgba(70,212,143,0)}}
@keyframes progress-shimmer{0%,28%{transform:translateX(-140%) skewX(-18deg)}70%,100%{transform:translateX(360%) skewX(-18deg)}}
@keyframes review-breathe{0%,100%{box-shadow:0 0 0 0 rgba(239,184,92,0)}50%{box-shadow:0 0 0 3px rgba(239,184,92,.10)}}
@keyframes card-flash{0%{box-shadow:0 0 0 1px rgba(88,166,255,.5),0 0 18px rgba(88,166,255,.18)}100%{box-shadow:0 8px 24px rgba(0,0,0,.12)}}
@media(prefers-reduced-motion:reduce){
  .live-dot,.state,.progress-fill::after,.work-row.recently-updated{animation:none!important}
  .progress-fill{transition:none!important}
}
.empty{border:1px dashed #2a425d;border-radius:16px;padding:22px 14px;text-align:center;color:var(--muted);font-size:12px}
.page-foot{padding:14px 2px 0;color:#6d8097;font-size:9px;line-height:1.5;text-align:center}
@media(max-width:520px){
  .brand h1{font-size:20px}
  .work-row{padding:9px 10px}
  .work-top{gap:5px}
  .state{margin-left:auto}
}
</style>
</head>
<body>
<main class="wrap">
<header class="top">
  <div class="brand"><h1>TigerIQ Live</h1><p>Danh sách công việc · chỉ xem</p></div>
  <div class="live"><span class="live-dot"></span><span id="liveLabel">ĐANG CẬP NHẬT</span></div>
</header>
<div id="err" class="err"></div>
<section aria-labelledby="workListHeading">
  <div class="list-head"><h2 id="workListHeading">DANH SÁCH CÔNG VIỆC</h2><span id="workMeta">—</span></div>
  <nav class="filters" aria-label="Lọc công việc">
    <button class="filter active" data-filter="open">ĐANG MỞ <b id="openCount">0</b></button>
    <button class="filter" data-filter="running">ĐANG CHẠY <b id="runningCount">0</b></button>
    <button class="filter" data-filter="waiting">CHỜ/BLOCKED <b id="waitingCount">0</b></button>
    <button class="filter" data-filter="done">HOÀN TẤT <b id="doneCount">0</b></button>
  </nav>
  <div id="workList" class="work-list"></div>
</section>
<footer class="page-foot">STT · Work Order · Tên việc · NV · Trạng thái · tự cập nhật 10 giây</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const LAST_GOOD_KEY='tigeriq-live-open-progress-v2';
const LAST_GOOD_MAX_MS=30*60*1000;
let snapshot=null;
let currentFilter='open';
const lastVisualState=new Map();
const stateLabel={OPEN:'MỞ',WORKING:'ĐANG LÀM',REVIEW:'ĐANG RÀ SOÁT',QUEUED:'CHỜ GIAO',WAITING:'CHỜ',BLOCKED:'BỊ CHẶN',DONE:'HOÀN TẤT'};
function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
function priorityRank(v){const m=String(v||'').toUpperCase().match(/^P([0-5])$/);return m?Number(m[1]):9}
function statusRank(v){return ({WORKING:0,REVIEW:1,QUEUED:2,WAITING:3,BLOCKED:4,DONE:9})[String(v||'').toUpperCase()]??8}
function workStatus(row){return String(row?.status||'WAITING').toUpperCase()}
function workPriority(row){
  const direct=String(row?.effectivePriority||row?.priority||'').toUpperCase();
  if(/^P[0-5]$/.test(direct))return direct;
  return String(row?.title||'').toUpperCase().match(/^\[(P[0-5])\]/)?.[1]||'META';
}
function workerFrom(row){
  const direct=String(row?.employeeId||row?.targetWorker||'').toUpperCase();
  if(/^(?:NV\d{2}|VY|CODEX|AUTO)$/.test(direct))return direct;
  const match=String(row?.title||'').toUpperCase().match(/(?:^|[^A-Z0-9])(NV\d{2})(?=$|[^A-Z0-9])/);
  return match?.[1]||'—';
}
function displayTitle(value){
  let title=String(value||'Chưa có tên việc').replace(/^\s*#?\d+\s*[-–—:]?\s*/,'').trim();
  const metadata=/^\[(?:P[0-5]|NV\d{2}|REVIEW|CODING|KNOWLEDGE|FAILOVER|CORE|ROUTING|VERCEL|APP-CHROME|OWNER(?:_DIRECT|→CODEX)?)\]\s*/i;
  while(metadata.test(title)) title=title.replace(metadata,'');
  return title||String(value||'Chưa có tên việc');
}
function normalizeRows(value){
  const fallbackOpen=()=>{
    const map=new Map();
    for(const row of [...(value?.activeWork||[]),...(value?.nextQueue||[])]) if(Number(row?.number)) map.set(Number(row.number),row);
    return [...map.values()];
  };
  const openRows=Array.isArray(value?.openWork)?value.openWork:fallbackOpen();
  if(currentFilter==='done') return (Array.isArray(value?.recentWork)?value.recentWork:[]).map(x=>({...x,status:'DONE'}));
  if(currentFilter==='running') return openRows.filter(x=>['WORKING','REVIEW'].includes(workStatus(x)));
  if(currentFilter==='waiting') return openRows.filter(x=>['QUEUED','WAITING','BLOCKED'].includes(workStatus(x)));
  return openRows;
}
function readLastGood(){try{const x=JSON.parse(localStorage.getItem(LAST_GOOD_KEY)||'null');return x?.value&&Date.now()-x.savedAt<=LAST_GOOD_MAX_MS?x.value:null}catch{return null}}
function writeLastGood(v){try{localStorage.setItem(LAST_GOOD_KEY,JSON.stringify({savedAt:Date.now(),value:v}))}catch{}}
function hydrate(raw){
  const projection=raw?.workProjection||{};
  if(raw?.ok&&projection.mode!=='unavailable'&&!projection.stale){writeLastGood(raw);return raw}
  const cached=readLastGood();if(!cached)return raw;
  return {...cached,ok:true,liveConnected:false,staleAll:true,staleAt:cached?.workProjection?.verifiedAt||cached?.generatedAt||null,liveReason:raw?.reason||projection.reason||'fetch failed',workProjection:{...(cached.workProjection||{}),stale:true,reason:raw?.reason||projection.reason||'fetch failed'}};
}
function updateCounts(){
  const s=snapshot?.openSummary||{};
  const openRows=Array.isArray(snapshot?.openWork)?snapshot.openWork:[...(snapshot?.activeWork||[]),...(snapshot?.nextQueue||[])];
  $('openCount').textContent=Number.isFinite(Number(s.open))?s.open:openRows.length;
  $('runningCount').textContent=Number.isFinite(Number(s.running))?s.running:openRows.filter(x=>['WORKING','REVIEW'].includes(workStatus(x))).length;
  $('waitingCount').textContent=Number.isFinite(Number(s.waiting))?s.waiting:openRows.filter(x=>['QUEUED','WAITING','BLOCKED'].includes(workStatus(x))).length;
  $('doneCount').textContent=Number.isFinite(Number(s.done))?s.done:(snapshot?.recentWork||[]).length;
}
function render(){
  if(!snapshot)return;
  updateCounts();
  const rows=normalizeRows(snapshot);
  const labels={open:'Đang mở',running:'Đang chạy',waiting:'Chờ / Blocked',done:'Hoàn tất'};
  $('workMeta').textContent=labels[currentFilter]+' · '+rows.length+' việc';
  const box=$('workList');box.innerHTML='';
  if(!rows.length){box.innerHTML='<div class="empty">Không có Work Order trong nhóm này.</div>';return}
  rows.forEach((row,index)=>{
    const el=document.createElement(row.url?'a':'article');
    const status=workStatus(row),label=stateLabel[status]||status;
    const priority=workPriority(row),priorityClass=String(priority).toLowerCase().replace(/[^a-z0-9]/g,'')||'meta';
    el.className='work-row status-'+status.toLowerCase()+' priority-'+priorityClass;
    if(row.url){el.href=row.url;el.target='_blank';el.rel='noopener'}
    const title=displayTitle(row.title);
    const rank=String(index+1).padStart(2,'0');
    const pct=Number(row?.progressPercent);
    const progress=Number.isFinite(pct)&&pct>=0&&pct<=100
      ?'<div class="progress" title="'+esc(row.progressDetail||'Tiến độ gate')+'"><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><span class="progress-text">'+pct+'%</span></div>'
      :'';
    const summaryText=String(row?.currentStep||'').trim();
    const summary=summaryText?'<div class="work-summary">'+esc(summaryText)+'</div>':'';
    const signature=status+'|'+(Number.isFinite(pct)?pct:'')+'|'+summaryText;
    const previous=lastVisualState.get(Number(row.number));
    if(previous&&previous!==signature)el.classList.add('recently-updated');
    lastVisualState.set(Number(row.number),signature);
    el.innerHTML='<div class="work-main"><div class="work-top"><span class="rank">'+esc(rank)+'</span><span class="work-id">#'+esc(row.number)+'</span><span class="priority '+esc(priorityClass)+'">'+esc(priority)+'</span><span class="work-nv">'+esc(workerFrom(row))+'</span><span class="state '+esc(status.toLowerCase())+'">'+esc(label)+'</span></div><div class="work-title">'+esc(title)+'</div>'+summary+progress+'</div>';
    box.append(el);
    if(el.classList.contains('recently-updated'))setTimeout(()=>el.classList.remove('recently-updated'),850);
  });
}
function show(value){
  snapshot=value;
  const projection=value?.workProjection||{};
  const stale=Boolean(value?.staleAll||projection.stale);
  const live=$('liveLabel').parentElement;live.classList.toggle('warn',!value?.liveConnected||stale);
  $('liveLabel').textContent=stale?'DỮ LIỆU CŨ':(value?.liveConnected?'PC01 LIVE':'DỰ PHÒNG');
  if(stale){
    $('err').classList.add('stale');
    $('err').textContent='Nguồn dữ liệu tạm lỗi. Đang giữ danh sách xác minh gần nhất; không xóa về 0.';
    $('err').style.display='block';
  }else{$('err').classList.remove('stale');$('err').style.display='none'}
  render();
}
async function load(){
  try{
    const r=await fetch('/api/live-status',{cache:'no-store'}),raw=await r.json(),value=hydrate(raw);
    if(!value?.ok)throw new Error(value?.reason||'Nguồn trạng thái chưa sẵn sàng');
    show(value);
  }catch(e){
    const cached=readLastGood();
    if(cached){show({...cached,liveConnected:false,staleAll:true,liveReason:String(e?.message||e)});return}
    $('liveLabel').textContent='MẤT DỮ LIỆU';$('err').textContent='Không có snapshot xác minh để hiển thị.';$('err').style.display='block';
  }
}
document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{
  currentFilter=button.dataset.filter||'open';
  document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===button));
  render();
}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
load();
setInterval(()=>{if(!document.hidden)load()},10000);
</script>
</body>
</html>
