<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="color-scheme" content="dark">
<title>TigerIQ Live · Trạng thái NV</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--bg:#07111f;--panel:#0e1b2b;--panel2:#102239;--line:#203953;--text:#f2f7fd;--muted:#91a4ba;--blue:#58a6ff;--green:#46d48f;--amber:#efb85c;--red:#ff747e;--gray:#77899e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{background:radial-gradient(circle at 90% -12%,#173b6e 0,transparent 36%),linear-gradient(180deg,#081322,#060d17);overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit}
.wrap{width:min(760px,100%);margin:auto;padding:max(14px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:4px 2px 14px}
.brand h1{font-size:22px;line-height:1.1;margin:0}
.brand p{font-size:12px;color:var(--muted);margin:5px 0 0}
.live{display:flex;align-items:center;gap:7px;border:1px solid #23513e;background:#0b241b;border-radius:999px;padding:7px 10px;font-size:11px;color:#9aebbd;white-space:nowrap}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(70,212,143,.5);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(70,212,143,0)}100%{box-shadow:0 0 0 0 rgba(70,212,143,0)}}
.err{display:none;border:1px solid #6d3038;background:#31191e;color:#ffb7bd;border-radius:14px;padding:11px 12px;margin-bottom:10px;font-size:12px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.sum{border:1px solid var(--line);background:linear-gradient(180deg,#102139,#0b1727);border-radius:14px;padding:10px 8px;min-width:0}
.sum span{display:block;font-size:10px;color:var(--muted);white-space:nowrap}
.sum b{display:block;font-size:22px;line-height:1;margin-top:6px}
.sum.work b{color:var(--green)}.sum.wait b{color:var(--amber)}.sum.block b{color:var(--red)}.sum.idle b{color:#aebdcc}
.filters{display:flex;gap:7px;overflow:auto;padding:1px 1px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{border:1px solid var(--line);background:#0a1727;color:#aabbd0;border-radius:999px;padding:7px 10px;font-size:11px;white-space:nowrap}
.filter.active{border-color:#3f78b7;background:#112b49;color:#d9ebff}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 9px;color:var(--muted);font-size:10px}
.list{display:grid;gap:9px}
.worker{display:block;border:1px solid var(--line);background:linear-gradient(180deg,rgba(16,34,57,.98),rgba(10,23,39,.98));border-radius:17px;padding:13px;box-shadow:0 8px 24px #0002}
.worker:active{transform:scale(.997)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.identity{min-width:0}
.identity b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.identity small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.badge{flex:none;border-radius:999px;padding:6px 8px;font-size:10px;font-weight:850;letter-spacing:.01em}
.badge.working{background:#103526;color:#8de7b1;border:1px solid #24533f}
.badge.waiting{background:#392b17;color:#ffd18b;border:1px solid #6a4d26}
.badge.blocked{background:#3b1d23;color:#ffb0b6;border:1px solid #6b3039}
.badge.idle{background:#1a2736;color:#b7c5d5;border:1px solid #34495f}
.badge.paused{background:#222a34;color:#98a7b7;border:1px solid #394756}
.job{font-size:14px;font-weight:750;line-height:1.35;margin-top:12px}
.detail{font-size:11px;color:var(--muted);line-height:1.4;margin-top:5px}
.progress{margin-top:10px;height:5px;background:#172b43;border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#3b91e8,#60d9a0);border-radius:999px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid #183047;font-size:10px;color:#8296ad}
.source{color:#86bfff;white-space:nowrap}
.empty{border:1px dashed #2a425d;border-radius:16px;padding:24px 14px;text-align:center;color:var(--muted);font-size:12px}
.page-foot{padding:14px 2px 0;color:#6d8097;font-size:9px;line-height:1.5;text-align:center}
@media(max-width:390px){.summary{gap:5px}.sum{padding:9px 6px}.sum span{font-size:9px}.sum b{font-size:20px}.brand h1{font-size:20px}.worker{padding:12px}.job{font-size:13px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top">
  <div class="brand"><h1>TigerIQ Live</h1><p>Trạng thái nhân sự · chỉ xem</p></div>
  <div class="live"><span class="live-dot"></span><span id="liveLabel">ĐANG CẬP NHẬT</span></div>
</header>
<div id="err" class="err"></div>
<section class="summary">
  <div class="sum work"><span>Đang làm</span><b id="sumWork">0</b></div>
  <div class="sum wait"><span>Chờ</span><b id="sumWait">0</b></div>
  <div class="sum block"><span>Bị chặn</span><b id="sumBlock">0</b></div>
  <div class="sum idle"><span>Rảnh</span><b id="sumIdle">0</b></div>
</section>
<nav class="filters" aria-label="Bộ lọc trạng thái">
  <button class="filter active" data-filter="all">Tất cả</button>
  <button class="filter" data-filter="working">Đang làm</button>
  <button class="filter" data-filter="waiting">Chờ</button>
  <button class="filter" data-filter="blocked">Bị chặn</button>
  <button class="filter" data-filter="idle">Rảnh</button>
  <button class="filter" data-filter="paused">Tạm ngưng</button>
</nav>
<div class="meta-row"><span id="workerCount">—</span><span id="updated">Chưa cập nhật</span></div>
<section id="workers" class="list"></section>
<footer class="page-foot">Dữ liệu từ GitHub + Registry · không có nút điều khiển · tự làm mới mỗi 10 giây</footer>
</main>
<script>
const $=id=>document.getElementById(id);
let snapshot=null,activeFilter='all';
const stateLabel={working:'ĐANG LÀM',waiting:'CHỜ',blocked:'BỊ CHẶN',idle:'RẢNH',paused:'TẠM NGƯNG'};
function age(iso){
  if(!iso)return 'chưa có mốc';
  const s=Math.max(0,Math.floor((Date.now()-Date.parse(iso))/1000));
  if(s<60)return s+' giây trước';
  const m=Math.floor(s/60);if(m<60)return m+' phút trước';
  const h=Math.floor(m/60);if(h<24)return h+' giờ trước';
  return Math.floor(h/24)+' ngày trước';
}
function sourceLabel(s){
  if(!s)return '';
  if(s.type==='PR'&&s.number)return 'PR #'+s.number;
  if(s.type==='Workflow'&&s.number)return 'Luồng #'+s.number;
  return s.type||'Nguồn';
}
function esc(t){const d=document.createElement('div');d.textContent=String(t??'');return d.innerHTML}
function render(){
  if(!snapshot)return;
  const s=snapshot.summary||{};
  $('sumWork').textContent=s.working||0;$('sumWait').textContent=s.waiting||0;$('sumBlock').textContent=s.blocked||0;$('sumIdle').textContent=s.idle||0;
  const all=snapshot.workers||[],rows=activeFilter==='all'?all:all.filter(x=>x.state===activeFilter);
  $('workerCount').textContent=rows.length+'/'+all.length+' nhân sự';
  $('updated').textContent='Cập nhật '+new Date(snapshot.generatedAt||Date.now()).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const box=$('workers');box.innerHTML='';
  if(!rows.length){box.innerHTML='<div class="empty">Không có nhân sự ở trạng thái này.</div>';return}
  rows.forEach(w=>{
    const el=document.createElement(w.source?.url?'a':'article');el.className='worker';
    if(w.source?.url){el.href=w.source.url;el.target='_blank';el.rel='noopener'}
    const pct=w.progress?.percent;
    el.innerHTML='<div class="head"><div class="identity"><b>'+esc(w.employeeId+' · '+w.label)+'</b><small>'+(w.command?'Lệnh '+esc(w.command)+' · ':'')+esc(w.adminState||'Registry')+'</small></div><span class="badge '+esc(w.state)+'">'+esc(stateLabel[w.state]||w.status||'—')+'</span></div><div class="job">'+esc(w.job||'Không có việc đang chạy')+'</div><div class="detail">'+esc(w.detail||'—')+'</div>'+(pct==null?'':'<div class="progress"><i style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></div>')+'<div class="foot"><span>'+esc(age(w.updatedAt))+'</span><span class="source">'+esc(sourceLabel(w.source))+(w.source?.url?' ↗':'')+'</span></div>';
    box.append(el);
  });
}
async function load(){
  try{
    const r=await fetch('/api/live-status',{cache:'no-store'}),d=await r.json();
    if(!d?.ok)throw new Error(d?.reason||'Nguồn trạng thái chưa sẵn sàng');
    snapshot=d;$('err').style.display='none';$('liveLabel').textContent='TRỰC TUYẾN';render();
  }catch(e){
    $('liveLabel').textContent='MẤT DỮ LIỆU';$('err').textContent='Không tải được trạng thái thật. Trang không tự đoán: '+String(e?.message||e);$('err').style.display='block';
  }
}
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');activeFilter=btn.dataset.filter;render();
}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
load();setInterval(()=>{if(!document.hidden)load()},10000);
</script>
</body>
</html>
