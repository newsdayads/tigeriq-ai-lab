<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center Web Control</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="shell">
        <h1>Command Center Web Control</h1>
        <form id="jobForm">
            <label for="jobInput">Job Description:</label>
            <input type="text" id="jobInput" name="jobInput" required>
            <button type="submit">Submit Job</button>
        </form>
        <div id="status"></div>
        <div id="taskPipeline" class="pipeline-container"></div>
    </div>
    <script src="server.js"></script>
</body>
</html>
