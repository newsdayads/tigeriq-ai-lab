<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>TigerIQ CopyBox</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#0b0f14;color:#eef3f8}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b0f14;color:#eef3f8}
    body{display:grid;place-items:center;padding:16px}
    .box{width:min(920px,100%);border:1px solid #2b3542;border-radius:14px;background:#111821;box-shadow:0 14px 32px #0007;overflow:hidden}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid #2b3542;background:#151e29}
    .title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
    .dot{width:9px;height:9px;border-radius:50%;background:#ff9418;box-shadow:0 0 0 3px #ff941826}
    .actions{display:flex;align-items:center;gap:8px}
    button{border:1px solid #394759;border-radius:9px;background:#1a2430;color:#eef3f8;padding:8px 11px;font:inherit;font-weight:700;cursor:pointer}
    button.primary{border-color:#ff9418;background:#ff9418;color:#111}
    button:focus-visible,textarea:focus-visible{outline:2px solid #ffad4a;outline-offset:2px}
    .content{padding:12px}
    textarea{display:block;width:100%;height:220px;min-height:220px;max-height:220px;resize:none;overflow:auto;overscroll-behavior:contain;border:1px solid #2a3542;border-radius:10px;background:#0c1219;color:#f5f7fa;padding:12px 13px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2}
    .foot{display:flex;justify-content:space-between;gap:12px;padding:0 12px 12px;color:#8593a3;font-size:11px}
    .status{min-height:16px;color:#9ce3ba}
    @media(max-width:640px){body{padding:10px}.box{border-radius:12px}.bar{padding:9px 10px}.title span:last-child{display:none}textarea{height:180px;min-height:180px;max-height:180px;font-size:12px}.content{padding:10px}.foot{padding:0 10px 10px}.actions button{padding:7px 9px}}
    @media(prefers-color-scheme:light){:root,html,body{background:#f4f6f8;color:#17202a}.box{background:#fff;border-color:#d7dde5;box-shadow:0 12px 28px #17202a1f}.bar{background:#f8fafc;border-color:#d7dde5}button{background:#fff;color:#17202a;border-color:#c9d1db}textarea{background:#fbfcfd;color:#17202a;border-color:#cfd7e1}.foot{color:#667382}.status{color:#187044}}
  </style>
</head>
<body>
  <main class="box" aria-label="TigerIQ CopyBox">
    <div class="bar">
      <div class="title"><span class="dot" aria-hidden="true"></span><span>TigerIQ CopyBox</span></div>
      <div class="actions">
        <button id="clear" type="button">Xóa</button>
        <button id="copy" class="primary" type="button">Sao chép</button>
      </div>
    </div>
    <div class="content">
      <textarea id="text" wrap="soft" spellcheck="false" aria-label="Nội dung cần sao chép" placeholder="Nội dung dài sẽ nằm trong khung này và cuộn bên trong."></textarea>
    </div>
    <div class="foot">
      <span id="count">0 ký tự</span>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </div>
  </main>
  <script>
    (()=>{
      const text=document.getElementById('text');
      const copy=document.getElementById('copy');
      const clear=document.getElementById('clear');
      const count=document.getElementById('count');
      const status=document.getElementById('status');
      const update=()=>{count.textContent=`${text.value.length.toLocaleString('vi-VN')} ký tự`;};
      const fromHash=()=>{
        const raw=location.hash.slice(1);
        if(!raw)return;
        const params=new URLSearchParams(raw);
        const plain=params.get('text');
        const b64=params.get('b64');
        try{
          if(plain!==null)text.value=plain;
          else if(b64){const normalized=b64.replace(/-/g,'+').replace(/_/g,'/');const bytes=Uint8Array.from(atob(normalized),c=>c.charCodeAt(0));text.value=new TextDecoder().decode(bytes);}
        }catch{status.textContent='Không đọc được nội dung từ liên kết.';}
      };
      const copyAll=async()=>{
        try{
          await navigator.clipboard.writeText(text.value);
          status.textContent='Đã sao chép toàn bộ.';
        }catch{
          text.focus();text.select();
          status.textContent='Đã chọn toàn bộ. Nhấn Ctrl+C để sao chép.';
        }
        setTimeout(()=>{status.textContent='';},2200);
      };
      copy.addEventListener('click',copyAll);
      clear.addEventListener('click',()=>{text.value='';status.textContent='';update();text.focus();});
      text.addEventListener('input',update);
      fromHash();update();
    })();
  </script>
</body>
</html>
